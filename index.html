<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="theme-color" content="#0a0909">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Деньги</title>
<style>
/* Тёмная тема в цветах логотипа: чёрный, красный, золото. Только системные шрифты — открывается мгновенно */
:root{
  --bg:#0a0909; --s1:#151312; --s2:#1e1b19; --s3:#27231f; --line:#2c2724;
  --text:#f6f1ea; --muted:#968c83; --dim:#6f665f;
  --red:#e3141f; --red-hi:#ff525a; --red-lo:#9e0b12;
  --gold:#dcaa6a; --gold-lo:#8f6a3c; --green:#46d08c; --amber:#f0b54a;
  --r:18px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(130% 55% at 50% 108%,rgba(227,20,31,.13),transparent 62%),
  radial-gradient(80% 40% at 100% -5%,rgba(220,170,106,.07),transparent 60%),var(--bg);
  display:flex;flex-direction:column;
  padding:calc(var(--st) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(var(--sb) + 12px) max(16px,env(safe-area-inset-left,0px))}
body.ny{padding-top:calc(var(--st) + 26px)}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* шапка */
.app{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
.hdr{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.brand{flex:1;display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.dot.off{background:var(--amber)}
.who{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--line);font-weight:700;color:var(--gold)}

/* вкладки */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:5px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button i{font-style:normal;font-size:16px}
.seg button.on{background:var(--s3);color:var(--text);box-shadow:inset 0 0 0 1px rgba(220,170,106,.35)}

/* рабочая зона */
.work{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;position:relative}
.mic{width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;position:relative;z-index:2;touch-action:none;
  background:radial-gradient(circle at 34% 28%,#ff6b72 0%,var(--red) 46%,var(--red-lo) 100%);
  box-shadow:0 0 0 7px rgba(220,170,106,.07),0 0 0 8px rgba(220,170,106,.18),0 22px 60px -12px rgba(227,20,31,.6),inset 0 -10px 24px rgba(0,0,0,.28);
  display:grid;place-items:center;transition:transform .12s ease}
.mic svg{width:32%;height:32%;fill:#fff;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.mic.rec{transform:scale(1.07)}
.ring{position:absolute;width:min(60vw,240px);height:min(60vw,240px);border-radius:50%;border:2px solid var(--red-hi);opacity:0;z-index:1}
.rec-on .ring{animation:pulse 1.4s ease-out infinite}.rec-on .ring.r2{animation-delay:.7s}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.hint{margin-top:24px;color:var(--muted);font-size:15px;text-align:center;min-height:22px}
.timer{color:var(--text);font-weight:600}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.act:active,.seg button:active,.who:active{background:var(--s3)}
.textbar{display:flex;gap:8px;margin-top:10px}
.textbar input{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--text);
  font:inherit;font-size:17px;padding:13px 14px;outline:none;-webkit-user-select:text;user-select:text}
.textbar input:focus{border-color:var(--gold-lo)}
.send{background:var(--red);border-radius:14px;width:52px;font-weight:700;font-size:20px}

/* лента */
.feed{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow:auto}
.item{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.item .t{flex:1;min-width:0}
.item .m{font-size:12px;color:var(--muted);margin-top:3px}
.item.wait{border-color:#4a3a1e}
.item.bad{border-color:#5a2328}
.item.q{border-color:#5d4826}
.ib{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ib button{background:var(--s3);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}
.ib button.y{background:var(--red)}
.ib button.warn{background:#5a2328}
.undo{color:var(--muted);font-size:13px;padding:2px 4px;white-space:nowrap}
.spin{width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;margin-top:3px;flex:none}
.ico{flex:none;width:16px;text-align:center;margin-top:1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* выдвижная панель (кошелёк / история / конвертер) */
.sheet{position:absolute;inset:10px 0 0;z-index:5;background:var(--s1);border:1px solid var(--line);border-radius:20px;
  overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 16px;animation:up .2s ease-out;box-shadow:0 20px 50px rgba(0,0,0,.5)}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--s1);padding:12px 0 8px;z-index:1}
.sh-h b{font-size:17px}
.x{width:32px;height:32px;border-radius:50%;background:var(--s3);color:var(--muted);font-size:15px}
.sec{font-size:11.5px;color:var(--gold);padding:14px 0 4px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:14px;padding:11px 10px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat small{font-size:11.5px;color:var(--muted)}
.neg{color:var(--red-hi)}.pos{color:var(--green)}
.log{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log .a{font-size:14px}.log .d{font-size:14px;color:var(--text);opacity:.92}.log small{color:var(--muted);font-size:12px}

/* конвертер */
.cv{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cv:last-of-type{border-bottom:0}
.cc{flex:none;width:40px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--gold);font-size:15px}
.cn{flex:1;min-width:0;display:flex;flex-direction:column;font-size:15px;font-weight:600}
.cn small{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cv input{width:44%;min-width:0;text-align:right;background:var(--s2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:inherit;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.cv input:focus{border-color:var(--gold)}
.cv-note{font-size:12px;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cv-note button{color:var(--gold);font-size:13px;font-weight:600}

/* настройка */
.setup{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;max-width:460px;margin:0 auto;width:100%;position:relative;z-index:1}
.setup h1{font-size:28px;margin:0;display:flex;align-items:center;gap:10px}
.setup p{color:var(--muted);margin:0;font-size:15px}
.setup textarea,.setup input{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;color:var(--text);
  font:inherit;padding:13px 14px;outline:none;-webkit-user-select:text;user-select:text}
.setup textarea{height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red)}
.btn{background:var(--red);border-radius:14px;padding:15px;font-weight:700;font-size:17px}
.note{background:var(--s1);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:#2e2926;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}

/* ===== праздники ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:var(--o);
  filter:blur(.4px);animation:fall var(--d) linear var(--l) infinite;will-change:transform}
@keyframes fall{0%{transform:translate3d(0,-2vh,0)}50%{transform:translate3d(var(--w),50vh,0)}100%{transform:translate3d(0,104vh,0)}}
.garland{position:fixed;left:0;right:0;top:calc(var(--st) + 2px);height:22px;z-index:30;pointer-events:none;display:flex;justify-content:space-around;padding:0 6px}
.garland::before{content:"";position:absolute;left:0;right:0;top:-6px;height:16px;
  background:repeating-radial-gradient(ellipse 40px 14px at 20px -4px,transparent 0 12px,rgba(170,140,100,.55) 12.5px 13.5px,transparent 14px);background-size:40px 16px}
.bulb{position:relative;width:7px;height:11px;border-radius:50% 50% 45% 45%;margin-top:7px;background:var(--c);
  box-shadow:0 0 8px 1px var(--c);animation:blink 1.8s ease-in-out var(--l) infinite alternate}
.bulb:nth-child(odd){margin-top:4px}
.bulb::before{content:"";position:absolute;top:-3px;left:1.5px;width:4px;height:3px;border-radius:1px;background:#5a4c3a}
@keyframes blink{0%{opacity:.35;box-shadow:0 0 2px 0 var(--c)}100%{opacity:1;box-shadow:0 0 10px 2px var(--c)}}
.heart{position:absolute;bottom:-40px;left:var(--x);font-size:var(--s);color:var(--c);opacity:.85;animation:rise var(--d) ease-in var(--l) infinite;will-change:transform}
@keyframes rise{0%{transform:translate3d(0,0,0) rotate(-10deg);opacity:0}10%{opacity:.9}50%{transform:translate3d(var(--w),-55vh,0) rotate(12deg)}100%{transform:translate3d(0,-112vh,0) rotate(-8deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.flake,.heart,.bulb{animation:none}.flake,.heart{display:none}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<!-- ======= НАСТРОЙКА ======= -->
<div id="setup" class="setup hidden">
  <h1><img src="apple-touch-icon.png" class="logo" alt="">Деньги</h1>
  <p>Вставьте код из Telegram-бота (команда <b>/app</b>) и выберите, кто вы.</p>
  <textarea id="code" placeholder="Код подключения"></textarea>
  <div class="chips" id="whoChips">
    <button class="chip" data-n="Сергей">Сергей</button>
    <button class="chip" data-n="Юлия">Юлия</button>
  </div>
  <input id="whoName" placeholder="Ваше имя" maxlength="30">
  <button class="btn" id="saveCfg">Готово</button>
  <div class="note" id="a2hs">Чтобы открывалось как приложение: в Safari нажмите «Поделиться» → «На экран Домой».</div>
</div>

<!-- ======= ГЛАВНЫЙ ЭКРАН ======= -->
<div id="main" class="app hidden">
  <header class="hdr">
    <img src="apple-touch-icon.png" class="logo" alt="">
    <div class="brand"><b>Деньги <span id="sIcon"></span></b><small id="net"><span class="dot"></span>на связи</small></div>
    <button class="who" id="whoBtn" aria-label="Сменить пользователя">?</button>
  </header>
  <nav class="seg">
    <button id="tab-w" data-p="w"><i>💰</i><span>Кошелёк</span></button>
    <button id="tab-h" data-p="h"><i>📜</i><span>История</span></button>
    <button id="tab-c" data-p="c"><i>💱</i><span>Конвертер</span></button>
  </nav>

  <div class="work">
    <section class="sheet hidden" id="sheet"></section>

    <div class="stage" id="stage">
      <div class="ring"></div><div class="ring r2"></div>
      <button class="mic" id="mic" aria-label="Записать голос">
        <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15zm6.5-3.6a.9.9 0 1 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 1 0-1.8 0 6.5 6.5 0 0 0 5.6 6.4V20H8.9a.9.9 0 1 0 0 1.8h6.2a.9.9 0 1 0 0-1.8h-2.2v-2.2a6.5 6.5 0 0 0 5.6-6.4z"/></svg>
      </button>
      <div class="hint" id="hint">Зажмите и скажите, на что потратили</div>
    </div>

    <div class="actions">
      <button class="act" id="photoBtn">📷 Чек</button>
      <button class="act" id="textBtn">⌨️ Текст</button>
    </div>
    <form class="textbar hidden" id="textbar">
      <input id="textIn" placeholder="магазин 1000" autocomplete="off" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Отправить">↑</button>
    </form>
    <input type="file" id="photoIn" accept="image/*" capture="environment" class="hidden">
    <div class="feed" id="feed"></div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const DEMO = /[?&]demo\b/.test(location.search);
const FORCE_SEASON = (location.search.match(/[?&]season=(\w+)/) || [])[1] || '';
let cfg = LS.get('cfg', null);
let feed = LS.get('feed', []);
let state = LS.get('state', null);
let queue = [];                       // то, что ещё не дошло до сервера (хранится в IndexedDB)

/* ================= праздничные украшения ================= */
(function decorate(){
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  const s = FORCE_SEASON || ((m === 11 && day >= 15) || m === 12 || (m === 1 && day <= 15) ? 'ny' : (m === 2 && day === 14) ? 'val' : '');
  const fx = $('fx'), r = (a, b) => a + Math.random() * (b - a);
  if (s === 'ny') {
    document.body.classList.add('ny');
    $('sIcon').textContent = '🎄';
    let h = '';
    for (let i = 0; i < 36; i++) h += `<i class="flake" style="--x:${r(0, 100).toFixed(1)}%;--s:${r(2.5, 6).toFixed(1)}px;--o:${r(.35, .85).toFixed(2)};--d:${r(9, 18).toFixed(1)}s;--l:-${r(0, 18).toFixed(1)}s;--w:${r(-28, 28).toFixed(0)}px"></i>`;
    fx.innerHTML = h;
    const g = document.createElement('div'); g.className = 'garland'; g.setAttribute('aria-hidden', 'true');
    const cols = ['#ff525a', '#ffd166', '#46d08c', '#6fb6ff', '#dcaa6a'];
    let b = ''; for (let i = 0; i < 18; i++) b += `<i class="bulb" style="--c:${cols[i % cols.length]};--l:-${(i * .37 % 1.8).toFixed(2)}s"></i>`;
    g.innerHTML = b; document.body.appendChild(g);
  } else if (s === 'val') {
    $('sIcon').textContent = '💘';
    const cols = ['#ff525a', '#ff7a9a', '#e3141f', '#ffb3c4'];
    let h = '';
    for (let i = 0; i < 16; i++) h += `<i class="heart" style="--x:${r(0, 95).toFixed(1)}%;--s:${r(14, 30).toFixed(0)}px;--c:${cols[i % 4]};--d:${r(7, 13).toFixed(1)}s;--l:-${r(0, 13).toFixed(1)}s;--w:${r(-40, 40).toFixed(0)}px">❤</i>`;
    fx.innerHTML = h;
  }
})();

/* ================= хранилище очереди (IndexedDB — не теряется при закрытии) ================= */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('dengi', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'cid' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('q', mode), req = fn(t.objectStore('q'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return { all: () => tx('readonly', s => s.getAll()), put: v => tx('readwrite', s => s.put(v)), del: k => tx('readwrite', s => s.delete(k)) };
})();
async function persist(q){ try { await IDB.put(q); } catch(e){ LS.set('queue_fallback', queue); } }
async function unpersist(cid){ try { await IDB.del(cid); } catch(e){ LS.set('queue_fallback', queue); } }
async function loadQueue(){
  let items = [];
  try { items = await IDB.all() || []; } catch(e){}
  const old = LS.get('queue', []).concat(LS.get('queue_fallback', []));   // перенос из старой версии
  old.forEach(o => { if (o && o.cid && !items.find(x => x.cid === o.cid)) { items.push(o); persist(o); } });
  try { localStorage.removeItem('queue'); localStorage.removeItem('queue_fallback'); } catch(e){}
  items.forEach(q => { q.status = q.status === 'sending' ? 'retry' : q.status; q.next = 0; });
  queue = items.sort((a, b) => a.ts - b.ts);
}

/* ================= подключение ================= */
function decodeCode(code){
  code = (code || '').trim().replace(/\s+/g, '');
  const b = code.replace(/-/g, '+').replace(/_/g, '/');
  const o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
  if (!o.u || !o.k) throw new Error('bad');
  return o;
}
const hm = location.hash.match(/c=([\w\-=]+)/);
if (hm) { $('code').value = hm[1]; history.replaceState(null, '', location.pathname + location.search); }
if (DEMO && !cfg) cfg = { u: 'demo', k: 'demo', who: 'Сергей' };

function showSetup(){
  $('main').classList.add('hidden'); $('setup').classList.remove('hidden');
  if (window.navigator.standalone) $('a2hs').classList.add('hidden');
  if (cfg && cfg.who) $('whoName').value = cfg.who;
}
document.querySelectorAll('#whoChips .chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('#whoChips .chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); $('whoName').value = c.dataset.n;
});
$('saveCfg').onclick = () => {
  let o;
  try { o = $('code').value.trim() ? decodeCode($('code').value) : (cfg ? { u: cfg.u, k: cfg.k } : null); }
  catch(e){ return toast('Код не подходит. Скопируйте его из бота ещё раз.'); }
  if (!o) return toast('Вставьте код из бота');
  const who = $('whoName').value.trim();

const CURS = [['USD', '$', 'Доллар'], ['EUR', '€', 'Евро'], ['RUB', '₽', 'Рубль РФ'], ['MDL', 'L', 'Молдавский лей'], ['PRB', 'р.', 'Рубль ПМР']];
const curName = c => (CURS.find(x => x[0] === c) || [c, c, c])[2];

  const r = (state && state.rates) || LS.get('rates', null) || { USD: 1, EUR: .9, RUB: 80, MDL: 18, PRB: 16.1 };
  return r;
}
const nf = (v, d) => { if (!isFinite(v)) return ''; const s = v.toFixed(d).replace(/\.?0+$/, ''); const [i, f] = s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (f ? ',' + f : ''); };
function converterHtml(){

  const R = getRates();
  document.querySelectorAll('[data-r]').forEach(el => { const c = el.dataset.r; el.textContent = c === 'USD' ? '1 € = ' + nf(1 / R.EUR, 3) + ' $' : '1 $ = ' + nf(R[c], R[c] < 10 ? 3 : 2) + ' ' + (CURS.find(x => x[0] === c) || [])[1]; });

function recalc(src){
  const R = getRates(), raw = src.value.replace(/\s/g, '').replace(',', '.');

function queueHtml(q){
  const s = q.status || 'new', tries = q.tries || 0;

  const slow = s === 'sending' && Date.now() - (q.sentAt || 0) > 12000;

  else { ico = '<span class="ico">⏳</span>'; msg = (q.err ? 'не получилось (' + esc(q.err) + ')' : 'нет связи') + ' — сохранено на телефоне, отправлю сам' + (tries ? ' · попытка ' + tries : ''); }
  const btns = sending || s === 'busy' ? '' : `<div class="ib"><button data-retry="${q.cid}">↻ Отправить сейчас</button><button class="${delArmed === q.cid ? 'warn' : ''}" data-del="${q.cid}">${delArmed === q.cid ? 'Точно удалить?' : '✕'}</button></div>`;
  return `<div class="item ${cls}">${ico}<div class="t">${esc(q.label)}<div class="m">${msg}</div>${btns}</div></div>`;

/* ================= сеть ================= */
async function api(body, timeoutMs, ctrl){
  if (DEMO) return demoApi(body);
  ctrl = ctrl || new AbortController();
  const tm = setTimeout(() => ctrl.abort(), timeoutMs || 20000);
  try {
    const r = await fetch(cfg.u, { method: 'POST', body: JSON.stringify(Object.assign({ k: cfg.k, who: cfg.who }, body)),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
function setState(s){ if (!s) return; state = s; LS.set('state', s); if (s.rates) LS.set('rates', s.rates); renderAll(); }
let refreshing = false;
async function refresh(){
  if (refreshing || !cfg) return; refreshing = true;
  try { const j = await api({ action: 'state' }, 20000); if (j.ok !== false) setState(j.state); } catch(e){}
  refreshing = false;
}

/* --- очередь отправки: по одной записи, с таймаутом и автоповтором; сама ничего не удаляет --- */
const BACKOFF = [3, 8, 15, 30, 60, 120];
let sending = null;
async function flush(force){
  if (sending || !cfg) return;
  const now = Date.now();
  const q = queue.find(x => x.status !== 'auth' && (force || !x.next || x.next <= now));
  if (!q) { renderNet(); return; }
  const ctrl = new AbortController();
  sending = { cid: q.cid, ctrl, t0: now };
  q.status = 'sending'; q.sentAt = now; q.err = '';
  renderFeed();
  const slowTick = setTimeout(renderFeed, 12500);
  try {
    const j = await api({ action: 'add', cid: q.cid, kind: q.kind, data: q.data, mime: q.mime, text: q.text, ts: q.ts }, 120000, ctrl);
    if (j.busy) { q.status = 'busy'; q.next = Date.now() + 6000; }
    else if (j.ok) {
      queue = queue.filter(x => x.cid !== q.cid); await unpersist(q.cid);
      const time = new Date(q.ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      (j.items || []).slice().reverse().forEach(it => feed.unshift({ id: it.id, line: it.line, who: cfg.who, date: time, ts: Date.now() }));
      if (j.reply) feed.unshift({ reply: j.reply.replace(/<[^>]+>/g, ''), time, ts: Date.now() });
      feed = feed.slice(0, 10); LS.set('feed', feed);
      if (j.state) setState(j.state);
    } else if (j.code === 'auth') { q.status = 'auth'; }
    else { q.tries = (q.tries || 0) + 1; q.status = 'retry'; q.err = 'ошибка сервера'; q.next = Date.now() + BACKOFF[Math.min(q.tries - 1, BACKOFF.length - 1)] * 1000; }
  } catch(e) {
    q.tries = (q.tries || 0) + 1; q.status = 'retry'; q.err = '';
    q.next = ctrl.manual ? 0 : Date.now() + BACKOFF[Math.min(q.tries - 1, BACKOFF.length - 1)] * 1000;
  }
  clearTimeout(slowTick);
  sending = null;
  if (queue.includes(q)) await persist(q);
  renderFeed();
  if (queue.some(x => x.status !== 'auth' && (!x.next || x.next <= Date.now()))) setTimeout(flush, 300);
}
async function enqueue(item){
  item.cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  item.ts = Date.now(); item.status = 'new'; item.tries = 0; item.next = 0;
  queue.push(item); renderFeed();
  await persist(item);        // сначала сохраняем на телефоне, потом отправляем
  flush();
}
async function removeQueued(cid){
  if (delArmed !== cid) { delArmed = cid; renderFeed(); setTimeout(() => { if (delArmed === cid) { delArmed = null; renderFeed(); } }, 3500); return; }
  delArmed = null;
  if (sending && sending.cid === cid) { sending.ctrl.manual = true; sending.ctrl.abort(); }
  queue = queue.filter(x => x.cid !== cid); await unpersist(cid); renderFeed();
}
// Вернулись в приложение / появился интернет: зависшую отправку обрываем и повторяем сразу (сервер не запишет дважды)
function wake(){
  if (!cfg) return;
  if (sending && Date.now() - sending.t0 > 4000) { sending.ctrl.manual = true; sending.ctrl.abort(); }
  queue.forEach(q => { if (q.status !== 'auth') q.next = 0; });
  setTimeout(() => flush(true), 50);
  refresh();
}
window.addEventListener('online', () => { renderNet(); wake(); });
window.addEventListener('offline', renderNet);
window.addEventListener('pageshow', wake);
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
setInterval(() => flush(), 4000);
setInterval(() => { if (!document.hidden) refresh(); }, 45000);

async function answer(pid, keep){
  answered.add(pid); renderFeed();
  try {
    const j = await api({ action: 'confirm', pid, keep }, 60000);
    if (j.ok === false && j.error) { toast(j.error); refresh(); return; }
    if (!keep) { feed.unshift({ reply: 'Не записал — это дубль', time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), ts: Date.now() }); LS.set('feed', feed); }
    if (j.state) setState(j.state);
  } catch(e) { answered.delete(pid); renderFeed(); toast('Нет связи, попробуйте ещё раз'); }
}
async function undo(id){
  undoing.add(id); renderAll();
  try { const j = await api({ action: 'undo', id }, 30000); if (j.state) setState(j.state); }
  catch(e){ toast('Не получилось отменить — нет связи'); }
  undoing.delete(id); renderAll();
}

/* ================= запись голоса (WAV 16 кГц) ================= */
let rec = null, tapMode = false, downAt = 0, timerInt = null;
const mic = $('mic'), stage = $('stage'), hint = $('hint');
const HINT = 'Зажмите и скажите, на что потратили';
let micStream = null;
async function getMic(){
  if (micStream && micStream.getAudioTracks().some(t => t.readyState === 'live')) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  return micStream;
}
function releaseMic(){ if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } }
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (rec) stopRec(true); releaseMic(); } });
window.addEventListener('pagehide', () => { if (rec) stopRec(true); releaseMic(); });

async function startRec(){
  if (rec) return;
  try {
    const stream = await getMic();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    src.connect(proc); proc.connect(ctx.destination);
    rec = { ctx, src, proc, chunks, rate: ctx.sampleRate, t0: Date.now() };
    mic.classList.add('rec'); stage.classList.add('rec-on');
    if (navigator.vibrate) navigator.vibrate(15);
    timerInt = setInterval(() => {
      const s = Math.floor((Date.now() - rec.t0) / 1000);
      hint.innerHTML = (tapMode ? 'Нажмите, чтобы отправить · ' : 'Отпустите, чтобы отправить · ') + `<span class="timer num">${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</span>`;
      if (s >= 90) stopRec(true);
    }, 200);
  } catch(e) { rec = null; toast('Нет доступа к микрофону. Разрешите его в настройках Safari.'); }
}
function stopRec(send){
  if (!rec) return;
  const r = rec; rec = null; tapMode = false;
  clearInterval(timerInt); hint.textContent = HINT;
  mic.classList.remove('rec'); stage.classList.remove('rec-on');
  try { r.proc.disconnect(); r.src.disconnect(); } catch(e){}
  try { r.ctx.close(); } catch(e){}
  const dur = (Date.now() - r.t0) / 1000;
  if (!send) return;
  if (dur < 0.8) return toast('Слишком коротко — зажмите и говорите');
  enqueue({ kind: 'voice', mime: 'audio/wav', data: encodeWav(r.chunks, r.rate, 16000), label: '🎙 Голосовое · ' + Math.round(dur) + ' с' });
}
function encodeWav(chunks, inRate, outRate){
  let len = 0; chunks.forEach(c => len += c.length);
  const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  const ratio = inRate / outRate, outLen = Math.floor(len / ratio), pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const s = Math.floor(i * ratio), e = Math.min(Math.floor((i + 1) * ratio), len);
    let sum = 0; for (let j = s; j < e; j++) sum += all[j];
    const v = Math.max(-1, Math.min(1, sum / Math.max(1, e - s)));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
  const ws = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  ws(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return b64(new Uint8Array(buf));
}
function b64(bytes){ let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }

mic.addEventListener('pointerdown', e => { e.preventDefault(); if (rec && tapMode) { stopRec(true); return; } downAt = Date.now(); startRec(); });
const up = () => {
  if (!rec && !downAt) return;
  const held = Date.now() - downAt; downAt = 0;
  if (held < 350) { tapMode = true; return; }     // короткое нажатие — «нажал, говоришь, нажал ещё раз»
  if (!tapMode) stopRec(true);
};
mic.addEventListener('pointerup', up);
mic.addEventListener('pointercancel', up);

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
let tt; function toast(m){ let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3400); }

/* ================= демо-режим для превью ================= */

    debts: [{ line: '🟢 Саша должен нам 500 р. ПМР' }] };
  return new Promise(r => setTimeout(() => {
    if (b.action === 'add') {
      if (b.kind === 'text' && /кварт/i.test(b.text)) { st.pending = [{ pid: 'demo' + Date.now(), line: '🔴 −3 500 р. ПМР · Жильё и коммуналка · квартира (03.11)', dupLine: '🔴 −3 500 р. ПМР · Жильё и коммуналка · квартира (03.11, записал(а) Сергей)' }]; return r({ ok: true, items: [], state: st }); }
      const l = b.kind === 'text' ? '🔴 −' + (b.text.match(/\d+/) || ['0'])[0] + ' р. ПМР · Продукты · ' + b.text.replace(/\d+/g, '').trim() : b.kind === 'photo' ? '🔴 −612 р. ПМР · Продукты · Шериф: мясо, овощи' : '🔴 −1 000 р. ПМР · Продукты · магазин';

    else if (b.action === 'undo') { st.recent.forEach(x => { if (x.id === b.id) x.x = true; }); r({ ok: true, state: st }); }
    else r({ ok: true, state: st });
  }, b.action === 'add' ? 1400 : 150));
}
