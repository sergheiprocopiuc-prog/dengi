      setTimeout(() => { const x = st.inbox.find(y => y.cid === b.cid); if (x) { x.status = 'готово'; x.result = { items: [{ id: 501, line: '🔴 −52 р. ПМР · Аптека · аптека' }] }; st.recent.unshift({ id: 501, line: '🔴 −52 р. ПМР · Аптека · аптека', who: cfg.who, rec: cfg.who, date: 'сейчас' }); } }, 4000);
      return r({ ok: true, accepted: true, queued: true, items: [], state: st });
    }
    if (b.action === 'add') {
      if (b.kind === 'text' && /кварт/i.test(b.text)) { st.pending = [{ pid: 'demo' + Date.now(), line: '🔴 −3 500 р. ПМР · Квартира и коммуналка · квартира (03.11)', dupLine: '🔴 −3 500 р. ПМР · Квартира и коммуналка · квартира (03.11, записал(а) Сергей)' }]; return r({ ok: true, items: [], state: st }); }
      const l = b.kind === 'text' ? '🔴 −' + (b.text.match(/\d+/) || ['0'])[0] + ' р. ПМР · Базовые продукты · ' + b.text.replace(/\d+/g, '').trim() : b.kind === 'photo' ? '🔴 −612 р. ПМР · Базовые продукты · Шериф: мясо, овощи' : '🔴 −1 000 р. ПМР · Базовые продукты · магазин';
      const id = Math.floor(Math.random() * 900 + 100); st.recent.unshift({ id, line: l, who: cfg.who, rec: cfg.who, date: 'сейчас' });
      st.log.unshift({ t: 'сейчас', k: new Date().toISOString().slice(0, 10), who: cfg.who, a: '✅ записал(а)', id: '#' + id, d: l, src: 'приложение · ' + b.kind });
      r({ ok: true, items: [{ id, line: l }], state: st });
    } else if (b.action === 'confirm') { st.pending = []; if (b.keep) st.recent.unshift({ id: 777, line: '🔴 −3 500 р. ПМР · Квартира и коммуналка · квартира', who: cfg.who, rec: cfg.who, date: 'сейчас' }); r({ ok: true, items: [], state: st }); }
    else if (b.action === 'drop') { st.inbox = st.inbox.filter(x => x.cid !== b.cid); r({ ok: true, state: st }); }
    else if (b.action === 'edit') {
      const rcv = st.recent.find(x => x.id === b.id), le = st.log.find(x => /^✅/.test(x.a) && x.id === '#' + b.id);
      const oldLine = rcv ? rcv.line : le ? le.d.split(' · состав')[0].split(' · «')[0].split(' · дата')[0] : '', p = parseOp(oldLine);
      const amt = b.amount !== undefined ? fmt(parseFloat(String(b.amount).replace(',', '.'))) + ' ' + p.amount.replace(/[\d,]/g, '').trim() : p.amount;
      const line = (b.type === 'доход' ? '🟢 +' : '🔴 −') + amt + ' · ' + b.category + ' · ' + (b.desc || p.desc);
      if (rcv) { rcv.line = line; rcv.fix = true; }
      st.log.unshift({ t: 'сейчас', k: new Date().toISOString().slice(0, 10), who: cfg.who, a: '✏️ исправил(а)', id: '#' + b.id, d: 'было: ' + oldLine + ' → стало: ' + line, src: 'приложение · правка' });
      r({ ok: true, item: { id: b.id, line }, state: st }); }
    else if (b.action === 'rule') {
      let moved = 0;
      st.stats.forEach(S => { let take = null; S.sections.forEach(sec => sec.cats.forEach(c => { const i = (c.items || []).findIndex(x => x[0] === b.match); if (i >= 0 && c.name !== b.category) { take = c.items.splice(i, 1)[0]; c.sum -= take[1]; sec.sum -= take[1]; moved++; } }));
        if (take) { const tsec = (st.cats.find(c => c.n === b.category) || {}).s || 'Прочее'; let sec = S.sections.find(x => x.name === tsec); if (!sec) S.sections.push(sec = { name: tsec, sum: 0, cats: [] }); let c = sec.cats.find(x => x.name === b.category); if (!c) sec.cats.push(c = { name: b.category, sum: 0, items: [] }); c.items.push(take); c.sum += take[1]; sec.sum += take[1];
          S.sections.forEach(sec => sec.cats = sec.cats.filter(c => c.sum > 0)); S.sections = S.sections.filter(sec => sec.sum > 0).sort((x, y) => y.sum - x.sum); } });
      st.log.unshift({ t: 'сейчас', k: new Date().toISOString().slice(0, 10), who: cfg.who, a: '📌 правило', id: '', d: b.match + ' → ' + b.category + ' · перенесено записей: ' + moved, src: '' });
      r({ ok: true, reply: '📌', state: st }); }
    else if (b.action === 'debtPay') { const d = st.debts.find(x => x.who === b.name && x.cur === b.cur); const v = Number(String(b.amount || Math.abs(d.net)).replace(',', '.')); if (v > Math.abs(d.net)) return r({ ok: false, error: 'Долг — только ' + Math.abs(d.net) + ' ' + d.sym }); d.net += d.net < 0 ? v : -v; d.hist.push({ t: d.net <= 0 ? 'возврат_отдали' : 'возврат_получили', a: v, d: 'сегодня', w: cfg.who }); if (Math.abs(d.net) < 0.01) st.debts = st.debts.filter(x => x !== d); r({ ok: true, items: [{ id: 98, line: '✅ возврат ' + v }], state: st }); }
    else if (b.action === 'piggyMove') { const P = st.piggy.active, v = Number(String(b.amount).replace(',', '.')) / st.rates[b.cur] * st.rates[P.cur] * (b.dir === 'out' ? -1 : 1);
      P.saved = Math.round(P.saved + v); P.usdTotal += v / st.rates[P.cur]; P.pct = Math.min(100, Math.floor(P.saved / P.goal * 1000) / 10);
      P.recent.unshift({ id: 99, type: b.dir === 'out' ? 'из_копилки' : 'в_копилку', who: cfg.who, amount: Number(b.amount), cur: b.cur, sym: { PRB: 'р. ПМР', USD: '$', EUR: '€', RUB: '₽', MDL: 'лей' }[b.cur], wallet: 'Наличные', date: 'сейчас' });
      if (P.saved >= P.goal) { st.piggy = { active: null, done: { id: P.id, name: P.name, goal: P.goal, cur: P.cur, sym: P.sym } }; }
      r({ ok: true, items: [], state: st }); }
    else if (b.action === 'piggyCreate') { st.piggy.active = { id: 2, name: b.name || 'Наша копилка', goal: Number(b.goal), cur: b.cur, sym: { PRB: 'р. ПМР', USD: '$', EUR: '€', RUB: '₽', MDL: 'лей' }[b.cur], deadline: b.deadline, who: cfg.who, created: 'сегодня', saved: 0, pct: 0, perMonth: 0, monthsLeft: 0, holdings: [], usdTotal: 0, months: [], recent: [] }; r({ ok: true, state: st }); }
    else if (b.action === 'reveal') { st.log.unshift({ t: '04.11 07:45', k: curMonth() + '-04', who: 'Сергей', a: '🎁 раскрыл(а) подарок', id: '#' + b.id, d: '🔴 −450 р. ПМР · Подарки друг другу · цветы — подарок для Юлия', src: '' }); st.myGifts = []; st.recent.forEach(x => { if (x.id === b.id) x.gift = ''; }); r({ ok: true, state: st }); }
    else if (b.action === 'undo') { st.recent.forEach(x => { if (x.id === b.id) x.x = true; }); r({ ok: true, state: st }); }
    else if (b.action === 'reconcile') r({ ok: true, sid: 'demo', mismatches: 1, since: '02.11', emptyDays: ['03.11'], res: b.facts.map((f, i) => ({ wallet: f.wallet, sym: 'р. ПМР', diff: i ? 0 : -340 })), state: st });
    else if (b.action === 'settle') r({ ok: true, items: [{ id: 99, line: '🔴 −340 р. ПМР · Неучтённые траты' }], state: st });
    else if (b.action === 'log') r({ ok: true, log: st.log.filter(e => (e.k || '').slice(0, 7) === b.month) });
    else r({ ok: true, state: st });
  }, b.action === 'add' ? 1400 : 150));
}

  if (cfg) showMain(); else showSetup();
  await loadQueue();
  if (cfg) { renderFeed(); refresh(); flush(true); }
})();
if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
